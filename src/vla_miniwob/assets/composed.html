<!doctype html>
<html><head><meta charset="utf-8"><title>MiniWoB procedure pilot</title>
<link rel="stylesheet" href="../upstream/core/core.css">
<script src="../upstream/core/core.js"></script>
<style>
html, body { margin: 0; padding: 0; overflow: hidden; background: #eee; }
#wrap, #sync-task-cover { width: 720px; height: 540px; }
#query, #reward-display, #click-canvas, #timer, #episode-id { display: none !important; }
#panels { display: grid; grid-template-columns: repeat(4, 170px); gap: 8px;
          padding: 8px; }
.panel { width: 168px; height: 240px; background: white; border: 1px solid #aaa; }
.label { font: 13px sans-serif; height: 23px; padding-left: 4px; line-height: 23px; }
iframe { width: 160px; height: 210px; border: 0; margin: 0 4px; display: block; }
</style>
<script>
// Composition adapter v1. Native MiniWoB task HTML and core are loaded unchanged.
// The evaluator ledger is read only by Python's environment, never by a policy.
window.benchmarkConfig = null;
window.benchmarkLedger = [];
window.benchmarkGoals = [];
window.benchmarkRewards = [];
window.benchmarkStep = 0;
core.EPISODE_MAX_TIME = 1000000000; // The protocol uses a primitive budget, not API latency.

function genProblem() {
  const config = window.benchmarkConfig;
  document.getElementById('panels').replaceChildren();
  window.benchmarkLedger = [];
  window.benchmarkGoals = [];
  window.benchmarkRewards = [];
  window.benchmarkStep = 0;
  if (!config) return;
  WOB_TASK_READY = false;
  const instructions = new Array(config.components.length);
  let loaded = 0;
  const event = (component, kind) => window.benchmarkLedger.push(
    {component, kind, step: window.benchmarkStep});
  for (const component of config.layout) {
    const panel = document.createElement('div'); panel.className = 'panel';
    const label = document.createElement('div'); label.className = 'label';
    label.textContent = 'Panel ' + String.fromCharCode(65 + component);
    const frame = document.createElement('iframe');
    frame.id = 'component-' + component;
    frame.onload = function() {
      const w = frame.contentWindow;
      // This seed controls the native task values and its internal geometry together.
      // The separate layout seed controls only the spatial permutation of panels.
      w.Math.seedrandom(String(config.seeds[component]));
      w.core.EPISODE_MAX_TIME = 1000000000;
      let finished = false;
      w.core.endEpisode = function(reward) {
        if (finished) return;
        finished = true;
        clearTimeout(w.core.EP_TIMER); clearInterval(w.core.CD_TIMER);
        // Native checkbox rewards include positive partial credit. Only full raw
        // reward satisfies a constituent goal; keep the raw value separately.
        const success = reward === 1;
        window.benchmarkRewards[component] = reward;
        window.benchmarkGoals[component] = success;
        event(component, success ? 'complete' : 'failure');
        if (!success) core.endEpisode(-1, false, 'component failure');
        else if (config.components.every((_, i) => window.benchmarkGoals[i]))
          core.endEpisode(1, false, 'all component goals');
      };
      // Capture meaningful interactions BEFORE the native target handlers run.
      w.document.addEventListener('click', e => {
        // Native tasks terminate on completion. Keep that absorbing-state rule
        // without displaying a progress label or covering the finished panel.
        if (finished) { e.preventDefault(); e.stopImmediatePropagation(); return; }
        if (e.target.closest('button,input,textarea,select,label,a,.alink,.widget'))
          event(component, 'progress');
      }, true);
      w.core.startEpisodeReal();
      clearTimeout(w.core.EP_TIMER); clearInterval(w.core.CD_TIMER);
      // Hide native debug/timer output outside the task surface.
      const css = w.document.createElement('style');
      css.textContent = 'html,body{overflow:hidden} #reward-display,#click-canvas{display:none!important}';
      w.document.head.appendChild(css);
      instructions[component] = w.core.getUtterance();
      loaded++;
      if (loaded === config.components.length) {
        const clauses = config.order.map(i => 'In panel ' + String.fromCharCode(65+i) +
          ', ' + instructions[i].replace(/\.$/, ''));
        let procedure;
        if (config.wording === 'reverse_clauses' && clauses.length > 1) {
          const relations = [];
          for (let i=clauses.length-1; i>0; i--)
            relations.push(clauses[i] + ', after completing: ' + clauses[i-1] + '.');
          procedure = relations.join(' ');
        } else procedure = clauses.join('; then ') + '.';
        document.getElementById('query').textContent = procedure +
          ' Perform each panel once. Complete each panel before beginning work in the next required panel.';
        WOB_TASK_READY = true;
      }
    };
    frame.src = '../upstream/miniwob/' + config.components[component] + '.html';
    panel.append(label, frame); document.getElementById('panels').append(panel);
  }
}
window.onload = () => core.startEpisode();
</script></head><body><div id="wrap"><div id="query"></div><div id="panels"></div></div></body></html>
