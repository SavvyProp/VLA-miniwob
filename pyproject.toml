[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scriptwob"
version = "0.2.0"
description = "Generated MiniWoB++ semantic scripts and validated frontier-expert demonstrations"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "miniwob", "numpy>=1.26", "pillow>=10", "pydantic>=2.8",
  "openai>=2.0", "typer>=0.12",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
scriptwob = "scriptwob.cli:app"

[tool.uv.sources]
miniwob = { git = "https://github.com/Farama-Foundation/miniwob-plusplus", rev = "33c3b4ddef8c6eb67c57a29663d844b1eda7e614" }

[tool.hatch.build.targets.wheel]
packages = ["src/scriptwob"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: requires Chrome and ChromeDriver"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
