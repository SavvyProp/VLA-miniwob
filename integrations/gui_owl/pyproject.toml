[project]
name = "scriptwob-gui-owl-runtime"
version = "0.1.0"
description = "Isolated GUI-Owl 1.5 / Qwen3-VL training and evaluation runtime"
requires-python = ">=3.11,<3.12"
dependencies = [
  "scriptwob",
  "transformers==4.57.6",
  "peft==0.17.1",
  "accelerate==1.10.1",
  "numpy==1.26.4",
  "safetensors==0.6.2",
  "torch==2.6.0",
  "torchvision==0.21.0",
]

[project.optional-dependencies]
cuda = ["torch==2.6.0", "torchvision==0.21.0", "bitsandbytes==0.48.1"]
cpu = ["torch==2.6.0", "torchvision==0.21.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
scriptwob = { path = "../..", editable = true }
miniwob = { git = "https://github.com/Farama-Foundation/miniwob-plusplus", rev = "33c3b4ddef8c6eb67c57a29663d844b1eda7e614" }
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu124", extra = "cuda" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu124", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
